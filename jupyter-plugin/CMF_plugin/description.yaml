Type: Jupyter Notebook Extension
Compatibility: 3.x, 4.x, 5.x, 6.x
Name: CMF Jupyter extension V2
Main: main.js
Link: README.md
Description: |
  Provides template code for the CMF metadat analysis.
  Makes it easier to enable cmf workflow
Parameters:
- name: auth_token
  description: Auth Token generated by the auth mechanism
  input_type: text
- name: api_base_url
  description: Base URL for the remote API server for data sources
  input_type: text
  default: 'http://dataspaces-7.labs.hpecorp.net:5000'